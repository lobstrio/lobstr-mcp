[project]
name = "lobstr-mcp"
version = "0.5.1"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Lobstr.io" }]
dependencies = [
    "cryptography>=50.0.1",
    # Pinned to the 3.x line the server runs. 4.x moved ToolResult (used by
    # render.py for TOON output) and changes annotation serialization; bump
    # deliberately, not via an unpinned rebuild. (Prod runs 3.4.x.)
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    # The MCP client is a thin adapter over the official SDK. 0.4.0 adds the
    # max_pages cap + user_agent/transport hooks + raw payloads it relies on.
    "lobstrio-sdk>=0.4.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.69.2",
]

[project.urls]
Homepage = "https://github.com/lobstrio/lobstr-mcp"
Documentation = "https://github.com/lobstrio/lobstr-mcp#readme"
Repository = "https://github.com/lobstrio/lobstr-mcp"
Issues = "https://github.com/lobstrio/lobstr-mcp/issues"
Changelog = "https://github.com/lobstrio/lobstr-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.37.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobstr_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
