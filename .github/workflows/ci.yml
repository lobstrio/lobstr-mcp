name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # redis 8.2.0 breaks fakeredis (2.39, 2.40): the persistence tests fail. Prod runs redis 8.1.0.
          pip install ".[dev]" "redis<8.2"
      - name: Test
        run: python -m pytest -q
