name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

jobs:
  # server.json valid against the registry's schema, the plugins and the extension on its version and endpoint,
  # and the hosted server answering with its five tools.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema requests
      - name: server.json matches the registry schema
        run: |
          python - <<'PY'
          import json, jsonschema, requests
          server = json.load(open("server.json"))
          schema = requests.get(server["$schema"], timeout=30).json()
          jsonschema.validate(server, schema)
          print("server.json ok")
          PY
      - name: the plugins and the extension carry server.json's version and endpoint
        run: |
          python - <<'PY'
          import json
          server = json.load(open("server.json"))
          url = server["remotes"][0]["url"]
          for path in ("claude-plugin/.claude-plugin/plugin.json", ".cursor-plugin/plugin.json", "gemini-extension.json"):
              manifest = json.load(open(path))
              assert manifest["version"] == server["version"], (path, manifest["version"])
              assert manifest["mcpServers"]["lobstr"]["url"] == url, path
          print("manifests ok:", server["version"])
          PY
      - name: the hosted server lists its tools
        run: |
          python - <<'PY'
          import json, requests
          r = requests.post(
              "https://api.lobstr.io/v2/mcp",
              json={"jsonrpc": "2.0", "id": 1, "method": "tools/list"},
              headers={"Accept": "application/json, text/event-stream"},
              timeout=30,
          )
          r.raise_for_status()
          body = r.text[r.text.find("{"):]
          tools = {t["name"] for t in json.loads(body)["result"]["tools"]}
          expected = {"find_operations", "get_operation", "run_operation", "get_balance", "send_feedback"}
          assert expected <= tools, tools
          print("tools ok:", sorted(tools))
          PY
